server:
  port: 8080
  servlet:
    context-path: /api/v1/procurement

spring:
  application:
    name: procurement-workflow-shred
  datasource:
    url: jdbc:postgresql://localhost:5432/procurement_db
    username: ${DB_USERNAME:procurement_user}
    password: ${DB_PASSWORD:procurement_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: procurement-workflow-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ai.shreds.shared.dtos,com.procurement.workflow
        spring.json.value.default.type: ai.shreds.shared.dtos.SharedReorderRequestEventDTO
        max.poll.interval.ms: 300000
        max.poll.records: 100
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        linger.ms: 10
        batch.size: 16384
        retries: 3
        acks: all
    topics:
      reorder-request: ${KAFKA_TOPIC_REORDER_REQUEST:ReorderRequestInitiated}
      purchase-order-transmitted: ${KAFKA_TOPIC_PO_TRANSMITTED:PurchaseOrderTransmitted}
      
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVICE_ISSUER_URI:http://localhost:8082}
          jwk-set-uri: ${AUTH_SERVICE_JWK_URI:http://localhost:8082/.well-known/jwks.json}
      client:
        registration:
          supplier-service:
            client-id: ${SUPPLIER_SERVICE_CLIENT_ID:procurement-service}
            client-secret: ${SUPPLIER_SERVICE_CLIENT_SECRET:secret}
            authorization-grant-type: client_credentials
          auth-service:
            client-id: ${AUTH_SERVICE_CLIENT_ID:procurement-service}
            client-secret: ${AUTH_SERVICE_CLIENT_SECRET:secret}
            authorization-grant-type: client_credentials

external:
  supplier-management:
    url: ${SUPPLIER_SERVICE_URL:http://localhost:8081/api}
    validation-endpoint: /internal/v1/suppliers/{supplierId}/validate-item
    info-endpoint: /internal/v1/suppliers/{supplierId}
    catalog-endpoint: /internal/v1/catalog/material/{materialId}/price
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082/api}
    validate-approval-endpoint: /v1/auth/validate-approval
    user-level-endpoint: /v1/users/{userId}/approval-level
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083/api}
    send-notification-endpoint: /v1/notifications
  email-service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8084/api}
    send-email-endpoint: /v1/emails/send-with-attachment
    send-notification-endpoint: /v1/emails/send

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      supplierService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      supplierService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      emailService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

approval:
  thresholds:
    supervisor: 5000.00
    manager: 25000.00
    director: 100000.00

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.apache.kafka: INFO
